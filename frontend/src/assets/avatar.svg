<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Glowing Backdrop Circle -->
  <circle cx="200" cy="200" r="170" fill="url(#bgGlow)" opacity="0.25" filter="url(#shadow)"/>
  <circle cx="200" cy="200" r="150" fill="url(#cardGrad)" stroke="url(#bgGlow)" stroke-width="4"/>

  <!-- Developer Silhouette / Character -->
  <!-- Shoulders / Suit / Hoodie -->
  <path d="M 100 350 C 100 280, 150 250, 200 250 C 250 250, 300 280, 300 350 Z" fill="#334155"/>
  <path d="M 130 350 C 140 295, 170 270, 200 270 C 230 270, 260 295, 270 350 Z" fill="#475569"/>
  <!-- Shirt V-neck -->
  <polygon points="180,270 220,270 200,320" fill="#3b82f6"/>

  <!-- Neck -->
  <rect x="180" y="210" width="40" height="50" rx="8" fill="#fbcfe8"/>

  <!-- Face Head -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="#fde68a"/>

  <!-- Modern Hair Style -->
  <path d="M 145 170 C 140 120, 170 95, 220 95 C 260 95, 265 130, 255 160 C 245 130, 225 115, 185 125 C 160 132, 148 150, 145 170 Z" fill="#0f172a"/>

  <!-- Smart Glasses (Developer Vibe) -->
  <rect x="160" y="165" width="30" height="20" rx="6" fill="none" stroke="#3b82f6" stroke-width="3.5"/>
  <rect x="210" y="165" width="30" height="20" rx="6" fill="none" stroke="#3b82f6" stroke-width="3.5"/>
  <line x1="190" y1="175" x2="210" y2="175" stroke="#3b82f6" stroke-width="3.5"/>
  <path d="M 160 172 L 145 168" stroke="#3b82f6" stroke-width="3"/>
  <path d="M 240 172 L 255 168" stroke="#3b82f6" stroke-width="3"/>

  <!-- Eyes -->
  <circle cx="175" cy="175" r="3.5" fill="#1e293b"/>
  <circle cx="225" cy="175" r="3.5" fill="#1e293b"/>

  <!-- Warm Smile -->
  <path d="M 185 210 Q 200 225 215 210" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating Tech Badges -->
  <!-- Java Badge Left -->
  <g transform="translate(45, 120)">
    <rect width="64" height="32" rx="16" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
    <text x="32" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f97316" text-anchor="middle">Java</text>
  </g>

  <!-- React Badge Right -->
  <g transform="translate(290, 120)">
    <rect width="68" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="34" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">React</text>
  </g>

  <!-- Code Tag Lower Right -->
  <g transform="translate(275, 270)">
    <rect width="84" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="42" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#a855f7" text-anchor="middle">&lt;Developer/&gt;</text>
  </g>
</svg>
